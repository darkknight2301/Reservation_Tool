# Reservation Management System - Nginx reverse proxy
#
# INTRANET-ONLY DEPLOYMENT: this config assumes the server is NOT exposed to
# the public internet (no port-forward/security-group rule from 0.0.0.0/0).
# Access is restricted to your internal network at three independent layers:
#   1. The host firewall (see deploy/firewall_setup.sh) - the primary control.
#   2. The `allow`/`deny` directives below (defense in depth).
#   3. DNS/hosts: give this server an internal-only name, never a public one.
#
# Edit ALLOWED_NETWORK_CIDR_* below to match your actual internal subnet(s)
# before deploying.

limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

server {
    listen 80;
    server_name reservation-system.internal;

    # Internal network allow-list (edit to match your site).
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny all;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name reservation-system.internal;

    # Internal network allow-list (edit to match your site).
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny all;

    # Self-signed / internal-CA certificate (see deploy/generate_self_signed_cert.sh).
    # A public CA (Let's Encrypt, etc.) cannot issue a cert for a name that
    # isn't publicly resolvable, which is expected for an intranet-only host.
    ssl_certificate     /etc/ssl/reservation-system/server.crt;
    ssl_certificate_key /etc/ssl/reservation-system/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    access_log /var/log/nginx/reservation-system.access.log;
    error_log  /var/log/nginx/reservation-system.error.log;

    client_max_body_size 20m;

    # Static assets served directly by Nginx (bypasses the app process).
    location /static/ {
        alias /opt/reservation-system/app/web/static/;
        expires 7d;
        access_log off;
    }

    # Tighter rate limit on the login endpoints to blunt credential stuffing,
    # in addition to the app's own per-IP/username limiter.
    location ~ ^/(login|api/v1/auth/login)$ {
        limit_req zone=login_limit burst=5 nodelay;
        # See the toggle note in the location / block below re: bare-metal vs Docker.
        proxy_pass http://unix:/run/reservation-system/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Bare-metal (systemd + Gunicorn unix socket) deployment:
        proxy_pass http://unix:/run/reservation-system/gunicorn.sock;
        # Docker Compose deployment: comment the line above and uncomment below
        # (docker-compose.yml binds the container's port 8000 to 127.0.0.1 only).
        # proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
