{% extends "base.html" %}
{% block title %}Product Management - Reservation System{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="bi bi-diagram-3 me-2"></i>Product Management</h4>
    <div class="d-flex gap-2">
        <a class="btn btn-outline-primary btn-sm" href="/admin/setups/template">
            <i class="bi bi-file-earmark-arrow-down me-1"></i>Blank Template
        </a>
        <button class="btn btn-outline-primary btn-sm" hx-get="/admin/setups/import-dialog" hx-target="#dialogContainer" hx-swap="innerHTML">
            <i class="bi bi-file-earmark-arrow-up me-1"></i>Import Setups
        </button>
        <button class="btn btn-primary btn-sm" hx-get="/admin/products/form" hx-target="#dialogContainer" hx-swap="innerHTML">
            <i class="bi bi-plus-lg me-1"></i>New Product
        </button>
    </div>
</div>
<div id="productList">
    {% include "admin/_products_list.html" %}
</div>
<div id="dialogContainer"></div>
{% endblock %}
