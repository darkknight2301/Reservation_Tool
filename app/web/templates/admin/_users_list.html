<div class="rms-table-wrapper">
    <table class="table table-hover table-sm align-middle mb-0">
        <thead>
            <tr>
                <th>Username</th><th>Full Name</th><th>Email</th><th>Role</th><th>Group</th>
                <th>Status</th><th>Active</th><th class="text-end">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for u in users %}
            <tr>
                <td>{{ u.username }}</td>
                <td>{{ u.full_name }}</td>
                <td>{{ u.email }}</td>
                <td><span class="badge text-bg-secondary">{{ u.role.name }}</span></td>
                <td>{{ u.group.name if u.group else "—" }}</td>
                <td><span class="badge rms-status-{{ u.status }}">{{ u.status }}</span></td>
                <td>{% if u.is_active %}<i class="bi bi-check-circle text-success"></i>{% else %}<i class="bi bi-x-circle text-danger"></i>{% endif %}</td>
                <td class="text-end">
                    <button class="btn btn-outline-secondary btn-sm" hx-get="/admin/users/form?user_id={{ u.id }}"
                            hx-target="#dialogContainer" hx-swap="innerHTML"><i class="bi bi-pencil"></i></button>
                    <button class="btn btn-outline-danger btn-sm" hx-delete="/admin/users/{{ u.id }}"
                            hx-target="#userList" hx-swap="innerHTML"
                            data-confirm-title="Deactivate user" data-confirm-body="Deactivate '{{ u.username }}'?">
                        <i class="bi bi-person-x"></i>
                    </button>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="8" class="text-center text-muted py-4">No users found.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
