{% extends "base.html" %}
{% block title %}Logs Dashboard - Reservation System{% endblock %}
{% block content %}
<h4 class="mb-3"><i class="bi bi-journal-text me-2"></i>Audit Logs</h4>

<div class="card rms-card mb-3">
    <div class="card-body py-2">
        <form class="row g-2" hx-get="/admin/logs/table" hx-target="#logsTableContainer" hx-swap="innerHTML">
            <div class="col-md-3">
                <input type="text" class="form-control form-control-sm" name="entity_type" placeholder="Entity type (e.g. Setup)"
                       hx-get="/admin/logs/table" hx-trigger="keyup changed delay:400ms" hx-target="#logsTableContainer" hx-swap="innerHTML" hx-include="closest form">
            </div>
            <div class="col-md-2">
                <input type="number" class="form-control form-control-sm" name="entity_id" placeholder="Entity ID"
                       hx-get="/admin/logs/table" hx-trigger="keyup changed delay:400ms" hx-target="#logsTableContainer" hx-swap="innerHTML" hx-include="closest form">
            </div>
            <div class="col-md-2">
                <input type="number" class="form-control form-control-sm" name="user_id" placeholder="User ID"
                       hx-get="/admin/logs/table" hx-trigger="keyup changed delay:400ms" hx-target="#logsTableContainer" hx-swap="innerHTML" hx-include="closest form">
            </div>
            <div class="col-md-3">
                <select class="form-select form-select-sm" name="action" hx-get="/admin/logs/table" hx-trigger="change" hx-target="#logsTableContainer" hx-swap="innerHTML" hx-include="closest form">
                    <option value="">All Actions</option>
                    {% for a in actions %}<option value="{{ a }}">{{ a }}</option>{% endfor %}
                </select>
            </div>
        </form>
    </div>
</div>

<div id="logsTableContainer">
    {% include "admin/_logs_list.html" %}
</div>
{% endblock %}
