<div class="rms-table-wrapper">
    <table class="table table-hover table-sm align-middle mb-0">
        <thead><tr><th>Name</th><th>Description</th><th class="text-end">Actions</th></tr></thead>
        <tbody>
            {% for group in groups %}
            <tr>
                <td>{{ group.name }}</td>
                <td class="rms-truncate">{{ group.description or "—" }}</td>
                <td class="text-end">
                    <button class="btn btn-outline-secondary btn-sm" hx-get="/admin/groups/form?group_id={{ group.id }}"
                            hx-target="#dialogContainer" hx-swap="innerHTML"><i class="bi bi-pencil"></i></button>
                    <button class="btn btn-outline-danger btn-sm" hx-delete="/admin/groups/{{ group.id }}"
                            hx-target="#groupList" hx-swap="innerHTML"
                            hx-confirm="Are you sure you want to delete '{{ group.name }}'?"
                            data-confirm-title="Delete group" data-confirm-body="Delete '{{ group.name }}'? Members/setups must be reassigned first.">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="3" class="text-center text-muted py-4">No groups configured yet.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
