<div class="modal fade" id="groupModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form hx-post="/admin/groups/save" hx-target="#groupList" hx-swap="innerHTML">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-people me-2"></i>{{ "Edit" if group else "New" }} Group</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="group_id" value="{{ group.id if group else '' }}">
                    <div class="mb-2">
                        <label class="form-label small">Name</label>
                        <input type="text" class="form-control" name="name" value="{{ group.name if group else '' }}" required maxlength="100">
                    </div>
                    <div class="mb-2">
                        <label class="form-label small">Description</label>
                        <textarea class="form-control" name="description" rows="3" maxlength="500">{{ group.description if group else '' }}</textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
    (function () {
        var modalEl = document.getElementById("groupModal");
        var modal = new bootstrap.Modal(modalEl);
        modal.show();
        modalEl.addEventListener("hidden.bs.modal", function () { modalEl.remove(); });
    })();
</script>
