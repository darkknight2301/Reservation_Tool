<div class="modal fade" id="setupImportModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form hx-post="/admin/setups/import" hx-target="#setupImportResult" hx-swap="innerHTML" hx-encoding="multipart/form-data">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-file-earmark-arrow-up me-2"></i>Import Setups from Excel</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="small text-muted">
                        Upload an <code>.xlsx</code> workbook matching the Setup import template (see
                        <a href="/admin/setups/template">Blank Template</a>). The import is all-or-nothing: if any
                        row fails validation, nothing is committed and a full error report is shown.
                    </p>
                    <input type="file" class="form-control" name="file" accept=".xlsx" required>
                    <div id="setupImportResult" class="mt-3"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-upload me-1"></i>Upload &amp; Import</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
    (function () {
        var modalEl = document.getElementById("setupImportModal");
        var modal = new bootstrap.Modal(modalEl);
        modal.show();
        modalEl.addEventListener("hidden.bs.modal", function () { modalEl.remove(); });
    })();
</script>
