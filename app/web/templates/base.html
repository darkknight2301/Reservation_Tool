<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Reservation Management System{% endblock %}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/styles.css">

    <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.12/dist/htmx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body hx-headers='{"X-Requested-With": "XMLHttpRequest"}'>

{% if current_user %}
{% include "partials/navbar.html" %}
{% endif %}

<main class="container-fluid px-3 px-md-4 py-3">
    {% block content %}{% endblock %}
</main>

{% include "partials/toast_container.html" %}
{% include "partials/confirm_modal.html" %}

<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
