{% extends "base.html" %}
{% block title %}Setups - Reservation System{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <h4 class="mb-0"><i class="bi bi-table me-2"></i>Reservation Table</h4>
    <div class="d-flex gap-2">
        <a class="btn btn-outline-primary btn-sm" href="/setups/export?product_id={{ filters.product_id or '' }}&group_id={{ filters.group_id or '' }}&status={{ filters.status or '' }}&location={{ filters.location or '' }}">
            <i class="bi bi-file-earmark-excel me-1"></i>Export
        </a>
        <button id="reserveActionBtn" class="btn btn-success btn-sm" disabled
                hx-get="/setups/reserve-dialog" hx-target="#dialogContainer" hx-swap="innerHTML"
                hx-vals="js:{setup_ids: document.getElementById('reserveActionBtn').getAttribute('data-setup-ids')}">
            <i class="bi bi-calendar-plus me-1"></i>Reserve
        </button>
        <button id="swapActionBtn" class="btn btn-warning btn-sm" disabled
                hx-get="/setups/swap-dialog" hx-target="#dialogContainer" hx-swap="innerHTML"
                hx-vals="js:{reservation_id: document.getElementById('swapActionBtn').getAttribute('data-reservation-ids')}">
            <i class="bi bi-arrow-left-right me-1"></i>Swap
        </button>
        <button id="unreserveActionBtn" class="btn btn-danger btn-sm" disabled
                hx-get="/setups/unreserve-dialog" hx-target="#dialogContainer" hx-swap="innerHTML"
                hx-vals="js:{reservation_ids: document.getElementById('unreserveActionBtn').getAttribute('data-reservation-ids')}">
            <i class="bi bi-calendar-x me-1"></i>Unreserve
        </button>
    </div>
</div>

<div class="card rms-card mb-3">
    <div class="card-body py-2">
        <form class="row g-2 align-items-center" hx-get="/setups/table" hx-target="#setupsTableContainer" hx-swap="innerHTML">
            <div class="col-md-3">
                <input type="text" class="form-control form-control-sm" name="search" placeholder="Search IP, hostname, hardware..."
                       value="{{ filters.search or '' }}" hx-get="/setups/table" hx-trigger="keyup changed delay:400ms"
                       hx-target="#setupsTableContainer" hx-swap="innerHTML" hx-include="closest form">
            </div>
            <div class="col-md-2">
                <select class="form-select form-select-sm" name="product_id" hx-get="/setups/table"
                        hx-trigger="change" hx-target="#setupsTableContainer" hx-swap="innerHTML" hx-include="closest form">
                    <option value="">All Products</option>
                    {% for product in products %}
                    <option value="{{ product.id }}" {% if filters.product_id == product.id %}selected{% endif %}>{{ product.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <select class="form-select form-select-sm" name="group_id" hx-get="/setups/table"
                        hx-trigger="change" hx-target="#setupsTableContainer" hx-swap="innerHTML" hx-include="closest form">
                    <option value="">All Groups</option>
                    {% for group in groups %}
                    <option value="{{ group.id }}" {% if filters.group_id == group.id %}selected{% endif %}>{{ group.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <select class="form-select form-select-sm" name="status" hx-get="/setups/table"
                        hx-trigger="change" hx-target="#setupsTableContainer" hx-swap="innerHTML" hx-include="closest form">
                    <option value="">All Statuses</option>
                    {% for s in ["AVAILABLE", "RESERVED", "MAINTENANCE", "RETIRED"] %}
                    <option value="{{ s }}" {% if filters.status == s %}selected{% endif %}>{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <input type="text" class="form-control form-control-sm" name="location" placeholder="Location"
                       value="{{ filters.location or '' }}" hx-get="/setups/table" hx-trigger="keyup changed delay:400ms"
                       hx-target="#setupsTableContainer" hx-swap="innerHTML" hx-include="closest form">
            </div>
            <div class="col-md-1 text-end">
                <span class="htmx-indicator spinner-border spinner-border-sm text-primary"></span>
            </div>
        </form>
    </div>
</div>

<div id="setupsTableContainer">
    {% include "setups/_table_body.html" %}
</div>

<div id="dialogContainer"></div>
{% endblock %}
{% block scripts %}
<script src="/static/js/table.js"></script>
{% endblock %}
