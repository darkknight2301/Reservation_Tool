<div class="modal fade" id="swapModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form hx-post="/setups/swap" hx-target="#setupsTableContainer" hx-swap="innerHTML"
                  hx-on::after-request="if(event.detail.successful){ bootstrap.Modal.getInstance(document.getElementById('swapModal')).hide(); }">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-arrow-left-right me-2 text-warning"></i>Request Setup Swap</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="reservation_id" value="{{ reservation.id }}">
                    <p class="small text-muted mb-1">Current setup</p>
                    <p class="mb-3"><i class="bi bi-hdd-network me-1"></i>{{ current_setup.hostname }} ({{ current_setup.ip_address }})</p>

                    <label class="form-label small">Swap to</label>
                    {% if candidate_setups %}
                    <select class="form-select" name="requested_setup_id" required>
                        {% for setup in candidate_setups %}
                        <option value="{{ setup.id }}">{{ setup.hostname }} ({{ setup.ip_address }}) - {{ setup.location }}</option>
                        {% endfor %}
                    </select>
                    {% else %}
                    <div class="alert alert-warning py-2 mb-0">No other AVAILABLE setups of the same product to swap to.</div>
                    {% endif %}

                    <div class="mt-3">
                        <label class="form-label small">Reason (optional)</label>
                        <textarea class="form-control" name="reason" rows="2"></textarea>
                    </div>
                    <div class="alert alert-info small mt-3 mb-0">
                        <i class="bi bi-info-circle me-1"></i>This request requires approval by a Lead or above before it takes effect.
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-warning" {% if not candidate_setups %}disabled{% endif %}><i class="bi bi-send me-1"></i>Submit Request</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
    (function () {
        var modalEl = document.getElementById("swapModal");
        var modal = new bootstrap.Modal(modalEl);
        modal.show();
        modalEl.addEventListener("hidden.bs.modal", function () { modalEl.remove(); });
    })();
</script>
