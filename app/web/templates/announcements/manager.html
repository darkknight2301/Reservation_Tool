{% extends "base.html" %}
{% block title %}Announcements - Reservation System{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="bi bi-megaphone me-2"></i>Announcements</h4>
    {% if 'announcement:manage' in current_user_permissions %}
    <button class="btn btn-primary btn-sm" hx-get="/announcements/form" hx-target="#dialogContainer" hx-swap="innerHTML">
        <i class="bi bi-plus-lg me-1"></i>New Announcement
    </button>
    {% endif %}
</div>

<div class="form-check form-switch mb-3">
    <input class="form-check-input" type="checkbox" id="activeOnlyToggle"
           hx-get="/announcements/list" hx-target="#announcementList" hx-swap="innerHTML"
           hx-trigger="change" hx-vals="js:{active_only: document.getElementById('activeOnlyToggle').checked}">
    <label class="form-check-label" for="activeOnlyToggle">Show active only</label>
</div>

<div id="announcementList">
    {% include "announcements/_list.html" %}
</div>

<div id="dialogContainer"></div>
{% endblock %}
