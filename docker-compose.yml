version: "3.9"

services:
  app:
    build: .
    image: reservation-system:latest
    container_name: reservation-system-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # SQLite file lives on the named volume below; override in .env for PostgreSQL.
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/reservation_system.db}
      EXPORT_DIR: /data/logs/exports
      EXCEL_LOG_DIR: /data/logs/excel_logs
      LOG_DIR: /data/logs
    volumes:
      - reservation_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  reservation_data:
