server {
    listen 443 ssl;
    server_name reservation-system.example.internal;

    ssl_certificate     /etc/ssl/certs/reservation-system.crt;
    ssl_certificate_key /etc/ssl/private/reservation-system.key;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    location / {
        proxy_pass http://unix:/run/reservation-system/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name reservation-system.example.internal;
    return 301 https://$host$request_uri;
}
