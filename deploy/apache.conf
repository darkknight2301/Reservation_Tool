# Reservation Management System - Apache reverse proxy (replaces Nginx)
#
# LAN-ONLY DEPLOYMENT: this config assumes the server is NOT exposed to the
# public internet (no port-forward/security-group rule from 0.0.0.0/0).
# Access is restricted to your internal network via the `Require ip` /
# `RequireAll` directives below. Edit ALLOWED_NETWORK_* to match your actual
# internal subnet(s) before deploying. (There is no separate OS-firewall
# script in this project -- this Apache config is the access-control layer.
# Pairing it with an OS firewall such as ufw/firewalld is still recommended
# as defense in depth, but is left to your own infrastructure standards.)
#
# Required modules:
#   sudo a2enmod ssl proxy proxy_http proxy_uds headers rewrite
#
# Required files:
#   /etc/ssl/reservation-system/server.crt
#   /etc/ssl/reservation-system/server.key
#   (see deploy/generate_self_signed_cert.sh, or use your internal CA)

<VirtualHost *:80>
    ServerName reservation-system.internal

    <RequireAll>
        Require ip 10.0.0.0/8
        Require ip 172.16.0.0/12
        Require ip 192.168.0.0/16
        Require ip 127.0.0.1
    </RequireAll>

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^/?(.*)$ https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName reservation-system.internal

    <RequireAll>
        Require ip 10.0.0.0/8
        Require ip 172.16.0.0/12
        Require ip 192.168.0.0/16
        Require ip 127.0.0.1
    </RequireAll>

    # Self-signed / internal-CA certificate (see deploy/generate_self_signed_cert.sh).
    # A public CA cannot issue a cert for a name that isn't publicly resolvable,
    # which is expected for a LAN-only host.
    SSLEngine on
    SSLCertificateFile      /etc/ssl/reservation-system/server.crt
    SSLCertificateKeyFile   /etc/ssl/reservation-system/server.key
    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite          HIGH:!aNULL:!MD5:!3DES
    SSLHonorCipherOrder     on

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"
    Header always set Content-Security-Policy "default-src 'self'"

    ErrorLog  ${APACHE_LOG_DIR}/reservation-system-error.log
    CustomLog ${APACHE_LOG_DIR}/reservation-system-access.log combined

    LimitRequestBody 20971520

    # Static assets served directly by Apache (bypasses the app process).
    Alias /static/ /opt/reservation-system/app/web/static/
    <Directory /opt/reservation-system/app/web/static/>
        Require all granted
        ExpiresActive On
        ExpiresDefault "access plus 7 days"
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off

    <Location /static/>
        ProxyPass !
    </Location>

    # Bare-metal (systemd + Gunicorn unix socket) deployment via mod_proxy_uds:
    <Location />
        ProxyPass         unix:/run/reservation-system/gunicorn.sock|http://localhost/
        ProxyPassReverse  unix:/run/reservation-system/gunicorn.sock|http://localhost/
    </Location>
    # Docker Compose deployment (docker-compose.yml binds the container's port to
    # 127.0.0.1 only): comment the <Location /> block above and uncomment below.
    # <Location />
    #     ProxyPass         http://127.0.0.1:8000/
    #     ProxyPassReverse  http://127.0.0.1:8000/
    # </Location>
</VirtualHost>
